<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px}
.cell-runner{max-width:none;margin:0;padding:0;gap:12px}</style></head>
<body><div class="cell-runner">
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <button type="button">Run &amp; check</button>
  <section style="display:contents"><button type="button" disabled>Submit</button></section>
  <aside style="display:contents"><button type="button">Show a hint</button></aside>
  <input type="text" value="HiAlan" style="max-width:200px" readonly/>
</div>
<fieldset>
  <label><input type="radio" name="c" checked/><span>HiAlan</span></label>
  <label><input type="radio" name="c"/><code>name = input("What's your name? ")</code></label>
</fieldset>
<div class="cell-eyebrow"><span>Step 2 of 4</span><span class="cell-kind-badge">Predict</span></div>
<div class="cell-progress"><span class="pip is-done"></span><span class="pip is-now"></span><span class="pip"></span><span class="pip"></span></div></div></body></html>
