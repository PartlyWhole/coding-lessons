<!-- @dsCard group="Colors" viewport="700x140" subtitle="Interactive-but-not-evaluative only; never for judgments" name="Accent — Bluebell" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div class="row"><div class="sw"><i style="background:var(--accent);"></i><b>--accent<br/>#5263D8</b></div><div class="sw"><i style="background:var(--accent-deep);"></i><b>--accent-deep<br/>#3F4FB8</b></div><div class="sw"><i style="background:var(--accent-tint);"></i><b>--accent-tint<br/>#ECEFFC</b></div><div class="sw"><i style="background:var(--accent-ink);"></i><b>--accent-ink<br/>#3A48A8</b></div>
<button style="font-family:var(--font-ui);font-weight:800;font-size:15px;color:#fff;background:var(--accent);border:0;border-radius:var(--radius-md);padding:10px 22px;box-shadow:0 3px 0 var(--accent-deep);cursor:pointer">Run &amp; check</button></div></body></html>
