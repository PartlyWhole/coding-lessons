<!-- @dsCard group="Colors" viewport="700x190" subtitle="Dark in BOTH page modes; 4 syntax hues + comment, all ≥4.5:1" name="Terrarium — editor palette" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div style="background:var(--code-bg);border-radius:var(--radius-lg);padding:12px 18px;font-family:var(--font-code);font-size:13.5px;line-height:1.9;color:var(--code-ink)">
<span style="color:var(--code-keyword)">keyword #92B3FF</span> · <span style="color:var(--code-string)">string #FFD08E</span> · <span style="color:var(--code-number)">number #8BD9B9</span> · <span style="color:var(--code-builtin)">builtin #C0AFFF</span> · <span style="color:var(--code-comment);font-style:italic">comment #8290A8</span><br/>
<span style="color:var(--code-line-number)">gutter #5C677E</span> · bg #242B39 · <span style="background:var(--code-bg-deep);padding:2px 8px;border-radius:6px">console #1B212C</span> · <span style="background:var(--code-selection);border-radius:3px;padding:0 4px">selection</span></div></body></html>
