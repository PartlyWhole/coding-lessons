<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div style="display:flex;align-items:center;gap:14px;margin:8px 0 0 6px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;width:36px;height:36px;transform:rotate(45deg)">
<span style="border-radius:22%;background:var(--accent)"></span><span style="border-radius:22%;background:#57A773"></span>
<span style="border-radius:22%;background:#57A773;opacity:.55"></span><span style="border-radius:22%;background:var(--accent);opacity:.55"></span></div>
<span style="font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.2px">Trellis</span>
<span style="font-family:var(--font-code);font-size:10.5px;color:var(--ink-soft);margin-left:10px">leaf green #57A773 — brand glyph &amp; course-map foliage only,<br/>never UI (would collide with pass-green)</span></div></body></html>
