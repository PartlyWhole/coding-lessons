<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div style="display:grid;gap:8px;font-size:13.5px">
<div style="background:var(--attr-misconception-surface);border:1px solid var(--attr-misconception-border);border-radius:12px;padding:8px 14px"><b style="font-family:var(--font-display);color:var(--attr-misconception-ink)">Let’s look closer</b> — “That’s the big one! Python will not secretly turn a number into text.”</div>
<div style="background:var(--attr-error-surface);border:1px solid var(--attr-error-border);border-radius:12px;padding:8px 14px"><b style="font-family:var(--font-display);color:var(--attr-error-ink)">Runtime error</b> — <span style="font-family:var(--font-code);font-size:12px">TypeError · line 2 — can only concatenate str (not "int") to str</span></div>
<div style="color:var(--ink-soft)">Questions before answers in hints: “Where did the space between the words go?” · Never shaming, never “WRONG”, no emoji.</div></div></body></html>
