<!-- @dsCard group="Colors" viewport="700x140" subtitle="Cream-tinted page; cards white; ink warm dark" name="Warm neutrals" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div class="row"><div class="sw"><i style="background:var(--paper);border-bottom:1px solid var(--line);"></i><b>--paper<br/>#FBF9F5</b></div><div class="sw"><i style="background:var(--surface);border-bottom:1px solid var(--line);"></i><b>--surface<br/>#FFFFFF</b></div><div class="sw"><i style="background:var(--surface-sunken);"></i><b>--surface-sunken<br/>#F4F0E9</b></div><div class="sw"><i style="background:var(--line);"></i><b>--line<br/>#E9E3D8</b></div><div class="sw"><i style="background:var(--line-strong);"></i><b>--line-strong<br/>#D8D0C1</b></div><div class="sw"><i style="background:var(--ink-faint);"></i><b>--ink-faint<br/>#A39A8B</b></div><div class="sw"><i style="background:var(--ink-soft);"></i><b>--ink-soft<br/>#6F675C</b></div><div class="sw"><i style="background:var(--ink);"></i><b>--ink<br/>#3B362E</b></div></div></body></html>
