<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Round but grown-up; two shadow levels, warm umber" name="Radii & elevation" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div class="row" style="align-items:flex-end">
<div style="width:78px;height:54px;background:var(--surface-sunken);border:2px solid var(--line-strong);border-radius:var(--radius-sm);display:grid;place-items:end start;padding:6px;font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft)">sm · 8</div><div style="width:78px;height:54px;background:var(--surface-sunken);border:2px solid var(--line-strong);border-radius:var(--radius-md);display:grid;place-items:end start;padding:6px;font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft)">md · 12</div><div style="width:78px;height:54px;background:var(--surface-sunken);border:2px solid var(--line-strong);border-radius:var(--radius-lg);display:grid;place-items:end start;padding:6px;font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft)">lg · 16</div><div style="width:78px;height:54px;background:var(--surface-sunken);border:2px solid var(--line-strong);border-radius:var(--radius-xl);display:grid;place-items:end start;padding:6px;font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft)">xl · 22</div><div style="width:78px;height:54px;background:var(--surface-sunken);border:2px solid var(--line-strong);border-radius:var(--radius-pill);display:grid;place-items:end start;padding:6px;font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft)">pill </div>
<div style="width:108px;height:54px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);display:grid;place-items:center;font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft)">shadow-1</div>
<div style="width:108px;height:54px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);display:grid;place-items:center;font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft)">shadow-2</div></div></body></html>
