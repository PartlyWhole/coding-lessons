<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div style="background:var(--code-bg);border-radius:var(--radius-lg);padding:14px 18px;font-family:var(--font-code);font-size:var(--text-code);line-height:var(--leading-code);color:var(--code-ink);font-variant-ligatures:none">
<span style="color:var(--code-builtin)">print</span>(<span style="color:var(--code-string)">"This "</span> + <span style="color:var(--code-string)">"is"</span> + <span style="color:var(--code-string)">" cool!"</span>)&nbsp;&nbsp;<span style="color:var(--code-comment);font-style:italic"># 0O 1lI != =&gt;</span></div></body></html>
