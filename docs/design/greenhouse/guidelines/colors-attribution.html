<!-- @dsCard group="Colors" viewport="700x210" subtitle="pass · misconception (amber ≠ red!) · mismatch · error — each a -ink/-surface/-border triad" name="Attribution palette (semantic, FINAL)" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

<div style="background:var(--attr-pass-surface);border:1px solid var(--attr-pass-border);border-radius:12px;padding:8px 14px">
<span style="font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--attr-pass-ink)">Correct</span>
<span style="font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft);float:right;margin-top:4px;white-space:nowrap">--attr-pass-*</span></div>
<div style="background:var(--attr-misconception-surface);border:1px solid var(--attr-misconception-border);border-radius:12px;padding:8px 14px">
<span style="font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--attr-misconception-ink)">Let’s look closer</span>
<span style="font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft);float:right;margin-top:4px;white-space:nowrap">--attr-misconception-*</span></div>
<div style="background:var(--attr-mismatch-surface);border:1px solid var(--attr-mismatch-border);border-radius:12px;padding:8px 14px">
<span style="font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--attr-mismatch-ink)">Not quite</span>
<span style="font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft);float:right;margin-top:4px;white-space:nowrap">--attr-mismatch-*</span></div>
<div style="background:var(--attr-error-surface);border:1px solid var(--attr-error-border);border-radius:12px;padding:8px 14px">
<span style="font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--attr-error-ink)">Runtime error</span>
<span style="font-family:var(--font-code);font-size:9.5px;color:var(--ink-soft);float:right;margin-top:4px;white-space:nowrap">--attr-error-*</span></div>
</div></body></html>
