<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{background:var(--paper);margin:0;padding:18px 22px;font-family:var(--font-ui);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw i{display:block;height:40px}
.sw b{display:block;font-family:var(--font-code);font-weight:500;font-size:9.5px;color:var(--ink-soft);padding:4px 6px;line-height:1.4}
</style></head><body>
<div style="font-weight:800;font-size:var(--text-title);line-height:1.45">The computer is about to greet Alan. What gets printed?</div>
<p style="font-size:var(--text-body);line-height:var(--leading-body);margin:8px 0 6px;max-width:60ch">The computer is greedy — it does <strong>not</strong> sprinkle in spaces for you. Inline code sits in a warm chip: <code style="font-family:var(--font-code);font-size:.88em;background:var(--codechip-bg);color:var(--codechip-ink);border-radius:6px;padding:1.5px 6px">"Hi " + name</code>.</p>
<div style="font-size:var(--text-small);font-weight:600;color:var(--ink-soft)">Reviewed earlier: “The + that glues text” · completed</div>
<div style="font-size:var(--text-micro);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px">Step 2 of 4 · Predict</div></body></html>
