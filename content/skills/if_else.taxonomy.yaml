# content/skills/if_else.taxonomy.yaml
# Topic: Python if/else conditionals. Three skills, ordered compare -> if_block -> else_branch.
# Every misconception carries triggers/notTriggers (§13.2.5).

skill:
  id: skill.cond.compare
  title: "Write a correct boolean comparison"
  description: "Compare two values with the right operator so the boundary case is handled correctly."
  upstream: []
  misconceptions:

    - id: mis.cond.strict_gt_boundary
      skill: skill.cond.compare
      title: "Used > where >= was meant (off-by-one at the boundary)"
      # Behavioral signal: a strict > fails exactly at the boundary case (case 0 = score 60).
      # The operator-encoding for Compare.ops is not pinned in the design, so we rely on the
      # boundary test failure rather than guessing an astTag (see misconception-patterns.md).
      signature: { testFailure: { caseIndex: 0 } }
      feedback: |
        Your comparison rejects the boundary value. The task says 60 counts as passing,
        but `>` means "strictly greater", so 60 itself fails. Use `>=` so the boundary
        value is included.
      hintLadder:
        - { level: 1, body: "What should happen when the score is exactly 60? Try that value in your head." }
        - { level: 2, body: "`>` excludes the boundary; `>=` includes it. Which one does the task need?" }
        - { level: 3, body: "For 'X or above', the boundary X must count, so the operator is `>=`. e.g. `score >= 60`." }
        - { level: 4, body: "Solution:", revealCode: "return score >= 60" }
      skillDeltas:
        - { skill: skill.cond.compare, kind: misconception, weight: 0.3 }
      triggers:
        - { stepKind: build, code: "def passes(score):\n    return score > 60" }
      notTriggers:
        # correct answer: passes the boundary case 0 -> signature must NOT fire
        - { stepKind: build, code: "def passes(score):\n    return score >= 60" }
        # a different wrong answer that STILL gets the boundary (60) right, so the
        # caseIndex:0 testFailure does not fire — proving the signature is specific to
        # the boundary and not just "any wrong answer".
        - { stepKind: build, code: "def passes(score):\n    return score >= 60 or score == 7" }

    - id: mis.cond.assign_in_condition
      skill: skill.cond.compare
      title: "Used = (assignment) instead of == (comparison)"
      # `if score = 60:` is a Python SyntaxError -> cannot be AST-attributed.
      # Caught at the recognize step (choice c).
      signature: { choice: c }
      feedback: |
        A single `=` assigns a value; it does not ask a question. To compare, use `==`
        (two equals signs). `score == 60` asks "is score equal to 60?".
      hintLadder:
        - { level: 1, body: "Are you assigning a value, or asking whether two values are equal?" }
        - { level: 2, body: "One `=` stores a value into a name. Comparing needs a different operator." }
        - { level: 3, body: "Equality uses two equals signs: `==`. Example: `if score == 60:`." }
        - { level: 4, body: "Solution:", revealCode: "score == 60" }
      skillDeltas:
        - { skill: skill.cond.compare, kind: misconception, weight: 0.3 }
      triggers:
        - { stepKind: recognize, choice: c }
      notTriggers:
        - { stepKind: recognize, choice: a }    # the correct `score == 60`

---

skill:
  id: skill.cond.if_block
  title: "Open an if statement (condition, colon, indented body)"
  description: "Write a syntactically correct if header and an indented body that runs only when the condition is True."
  upstream: [ skill.cond.compare ]
  misconceptions:

    - id: mis.cond.missing_colon
      skill: skill.cond.if_block
      title: "Forgot the colon at the end of the if header"
      # `if score >= 60` (no colon) is a SyntaxError -> not AST-attributable.
      # Caught at the recall step via the colon-less input.
      signature: { recallEquals: "if score >= 60" }
      feedback: |
        Every `if` header must end with a colon `:`. Without it Python raises a
        SyntaxError. Write `if score >= 60:`.
      hintLadder:
        - { level: 1, body: "Compare your line, character by character, to the examples. What is at the very end of theirs?" }
        - { level: 2, body: "An `if` line always ends with one piece of punctuation that opens the block." }
        - { level: 3, body: "That punctuation is a colon `:`. It goes at the end of the header." }
        - { level: 4, body: "Solution:", revealCode: "if score >= 60:" }
      skillDeltas:
        - { skill: skill.cond.if_block, kind: misconception, weight: 0.3 }
      triggers:
        - { stepKind: recall, input: "if score >= 60" }
      notTriggers:
        - { stepKind: recall, input: "if score >= 60:" }       # correct
        - { stepKind: recall, input: "if score => 60:" }       # a different wrong answer

    - id: mis.cond.no_indent
      skill: skill.cond.if_block
      title: "Did not indent the body under the if"
      # Un-indented body is an IndentationError (a SyntaxError subclass) -> not AST-attributable.
      # Caught at the recognize step (choice b).
      signature: { choice: b }
      feedback: |
        The body of an `if` must be indented underneath it (4 spaces). The indentation
        is what tells Python the line belongs to the `if`. An un-indented line raises an
        IndentationError.
      hintLadder:
        - { level: 1, body: "How does Python know which lines are 'inside' the if?" }
        - { level: 2, body: "It is the spacing at the start of the line. Compare the two options' second lines." }
        - { level: 3, body: "The body must be indented (4 spaces) under the header." }
        - { level: 4, body: "Solution:", revealCode: "if score >= 60:\n    print('ok')" }
      skillDeltas:
        - { skill: skill.cond.if_block, kind: misconception, weight: 0.3 }
      triggers:
        - { stepKind: recognize, choice: b }
      notTriggers:
        - { stepKind: recognize, choice: a }    # the correctly-indented block

---

skill:
  id: skill.cond.else_branch
  title: "Handle the complementary case with else"
  description: "Add a bare else: branch that covers exactly the cases the if did not."
  upstream: [ skill.cond.if_block ]
  misconceptions:

    - id: mis.cond.else_with_condition
      skill: skill.cond.else_branch
      title: "Put a condition on else (else <cond>:)"
      # `else score < 60:` is a SyntaxError -> not AST-attributable. Caught at recognize (choice b).
      signature: { choice: b }
      feedback: |
        `else` never takes a condition — it is just `else:`. It already means "in every
        case the if did not catch". If you need another condition, that is `elif`, but
        for a simple two-way choice plain `else:` is what you want.
      hintLadder:
        - { level: 1, body: "What cases does `else` cover? Does it need to be told which ones?" }
        - { level: 2, body: "`else` is the catch-all for everything the `if` missed, so it needs no test of its own." }
        - { level: 3, body: "Write it bare: `else:` with nothing between `else` and the colon." }
        - { level: 4, body: "Solution:", revealCode: "else:" }
      skillDeltas:
        - { skill: skill.cond.else_branch, kind: misconception, weight: 0.3 }
      triggers:
        - { stepKind: recognize, choice: b }
      notTriggers:
        - { stepKind: recognize, choice: a }    # the correct bare `else:`

    - id: mis.cond.second_if_not_else
      skill: skill.cond.else_branch
      title: "Used a second independent if instead of else"
      # AST-detectable: two sibling If nodes and no else/orelse. Paired with the behavioral
      # test failure (AST ranks above test; the test corroborates). If the second condition
      # does not perfectly partition, a case fails.
      signature: { all: [ { astTag: two_ifs_no_else }, { testFailure: {} } ] }
      feedback: |
        You wrote two separate `if`s instead of an `if/else`. Two independent ifs can
        leave gaps or overlap, so some scores get the wrong answer (or no answer). Attach
        an `else:` to the first `if` so the second case is exactly "everything else".
      hintLadder:
        - { level: 1, body: "Are your two conditions guaranteed to cover every score with no overlap?" }
        - { level: 2, body: "A second independent `if` is not tied to the first. What ties 'the other case' to the first if?" }
        - { level: 3, body: "Replace the second `if` with `else:`, which automatically covers the remaining cases." }
        - { level: 4, body: "Solution:", revealCode: "if score >= 60:\n    return 'pass'\nelse:\n    return 'fail'" }
      skillDeltas:
        - { skill: skill.cond.else_branch, kind: misconception, weight: 0.3 }
      triggers:
        - { stepKind: build, code: "def grade(score):\n    if score >= 60:\n        return 'pass'\n    if score < 50:\n        return 'fail'" }
      notTriggers:
        - { stepKind: build, code: "def grade(score):\n    if score >= 60:\n        return 'pass'\n    else:\n        return 'fail'" }   # correct if/else
        - { stepKind: build, code: "def grade(score):\n    if score >= 60:\n        return 'pass'\n    return 'fail'" }                # correct guard-clause (blessed acceptedVariant)
