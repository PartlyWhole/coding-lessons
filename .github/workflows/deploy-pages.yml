# Build the static Trellis app and deploy it to GitHub Pages.
# The app is fully static by design (frozen M5 contract: no backend, Pyodide from the
# pinned jsDelivr CDN, no SharedArrayBuffer → no COOP/COEP headers needed), so Pages
# can host it as-is. Site root = packages/client/{index.html, dist/app/**}.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable corepack (pnpm pinned via packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build all packages (incl. the static app bundle)
        run: pnpm -r build
      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp packages/client/index.html _site/index.html
          cp -R packages/client/dist/app _site/dist/app
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
