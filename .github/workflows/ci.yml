name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      # pnpm -r, not the root turbo scripts: turbo's ^build graph hard-fails on the
      # dev-only engine<->sandbox test-dependency cycle (benign at runtime; the native-ESM
      # probes prove the production graph acyclic). Mirrors the validated local gate.
      # Build FIRST: on a fresh checkout @trellis/schema's types resolve to dist/*.d.ts.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      # Content gates (the Python reference validators + the TS compiler's gates 1-9) —
      # so content regressions can't reach main unguarded once rebuild handovers arrive.
      - run: python3 -m pip install pyyaml
      - run: python3 content/validate.py
      - run: python3 content/verify/harness.py
      - run: node packages/authoring/dist/src/cli.js lint content
