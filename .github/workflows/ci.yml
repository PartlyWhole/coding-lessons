name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm -r, not the root turbo scripts: turbo's ^build graph hard-fails on the
      # dev-only engine<->sandbox test-dependency cycle (benign at runtime; the native-ESM
      # probes prove the production graph acyclic). Mirrors the validated local gate.
      # Build FIRST: on a fresh checkout @trellis/schema's types resolve to dist/*.d.ts.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
